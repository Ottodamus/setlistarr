services:
  setlistarr:
    build: .
    image: setlistarr:latest
    container_name: setlistarr
    restart: unless-stopped
    ports:
      - ${SETLISTARR_PORT:-8787}:8787
    volumes:
      - ${CONFIG_PATH:-/opt/docker/setlistarr/config}:/config
    # Every value can be set from Portainer's stack "Environment variables" section (or a .env
    # file next to this one). Leave optional ones empty to configure them in the web UI instead.
    environment:
      - TZ=${TZ:-UTC}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # Admin login. Leave both empty to create the account on the first-visit setup page.
      - ADMIN_USERNAME=${ADMIN_USERNAME:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # AI provider keys, used by providers whose key field is left blank in the UI.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # Optional: pinning any of these makes the field read-only in Settings.
      - PLEX_URL=${PLEX_URL:-}
      - PLEX_TOKEN=${PLEX_TOKEN:-}
      - LASTFM_API_KEY=${LASTFM_API_KEY:-}
      - MUSICBRAINZ_CONTACT=${MUSICBRAINZ_CONTACT:-}
      # Discover: Lidarr and ListenBrainz (or enter them in Discover settings).
      - LIDARR_URL=${LIDARR_URL:-}
      - LIDARR_API_KEY=${LIDARR_API_KEY:-}
      - LISTENBRAINZ_TOKEN=${LISTENBRAINZ_TOKEN:-}
      # 1 only when served over HTTPS (reverse proxy / tunnel); plain-HTTP LAN needs 0.
      - SETLISTARR_COOKIE_SECURE=${SETLISTARR_COOKIE_SECURE:-0}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
