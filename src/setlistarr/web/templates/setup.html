<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set up · Setlistarr</title>
  <link rel="stylesheet" href="/static/app.css?v={{ version }}">
  <link rel="icon" href="/static/icons/favicon.ico" sizes="any">
  <link rel="icon" href="/static/icons/icon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <link rel="manifest" href="/static/icons/site.webmanifest">
  <meta name="theme-color" content="#2a2e52">
</head>
<body class="auth-page">
  <form method="post" action="/setup" class="card auth-card">
    <div class="brand"><img src="/static/icons/logo.png" alt="" width="32" height="32"><span class="brand-text">Setlist<span>arr</span></span></div>
    <p class="dim small" style="margin:0">Create the admin account. (Or set ADMIN_USERNAME / ADMIN_PASSWORD in the container's environment.)</p>
    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
    <label>Username<input type="text" name="username" autocomplete="username" required autofocus></label>
    <label>Password (8+ characters)<input type="password" name="password" autocomplete="new-password" minlength="8" required></label>
    <label>Confirm password<input type="password" name="password2" autocomplete="new-password" minlength="8" required></label>
    <button class="btn primary" type="submit">Create account</button>
  </form>
</body>
</html>
