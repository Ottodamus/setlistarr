[project]
name = "setlistarr"
dynamic = ["version"]  # single source: src/setlistarr/__init__.py
description = "AI-built Plex music playlists, grounded in the tracks you actually own"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "requests>=2.31",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
    "structlog>=24.1",
    "mcp>=2.0,<3",
    "anthropic>=1.15,<2",
    "openai>=3.0,<4",
    "pillow>=10.4",
    "resvg-py>=0.5,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-httpserver>=1.0",
]

[project.scripts]
setlistarr = "setlistarr.cli:main"
setlistarr-mcp = "setlistarr.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "setlistarr.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
setlistarr = [
    "core/migrations/*.sql",
    "web/templates/*.html",
    "web/templates/partials/*.html",
    "web/static/*.css",
    "web/static/*.js",
    "web/static/vendor/*.js",
    "web/static/vendor/*.css",
    "web/static/icons/*.png",
    "web/static/icons/*.ico",
    "web/static/icons/*.webmanifest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
